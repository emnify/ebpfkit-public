name: runner-test
on:
  push:
    branches-ignore:
      - 'dependabot/**'

jobs:
  test:
    runs-on: ebpfkit-amd64-4core
    strategy:
      matrix:
        tag:
         - 6.8
         - 6.15
    steps:
     - name: Git checkout
       uses: actions/checkout@v4
     - name: Set up Go
       uses: actions/setup-go@v5
       with:
         go-version: 1.23
     - name: Get QEMU
       run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86
     - name: Open up KVM for everyone
       run: sudo chmod 0666 /dev/kvm
     - name: "Install vimto: virtual machine testing orchestrator for the Go toolchain"
       run: CGO_ENABLED=0 go install lmb.io/vimto@v0.2.0
     - name: Run tests
       run: vimto -sudo -kernel ghcr.io/cilium/ci-kernels:${{ matrix.tag }} -- go test -v ./...
